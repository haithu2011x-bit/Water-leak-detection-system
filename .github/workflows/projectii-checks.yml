name: Project II Python and Dashboard checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: projectii-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-streamlit:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "paho-mqtt>=2.0,<3" "pandas>=2.2,<3" "numpy>=1.26,<3" "scikit-learn>=1.5,<2" "joblib>=1.3,<2" "streamlit>=1.61,<2" "pyserial>=3.5,<4"

      - name: Compile Python source
        run: python -m compileall -q ai backend dashboard tools tests

      - name: Run all unit and navigation tests (temporary databases)
        run: python -m unittest discover -s tests -p "test_*.py" -v
