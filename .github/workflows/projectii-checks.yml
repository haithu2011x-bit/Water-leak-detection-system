name: Project II Python and Dashboard checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-streamlit:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "streamlit>=1.61,<2"

      - name: Compile Python source
        run: python -m compileall -q ai backend dashboard tools tests

      - name: Run all unit and navigation tests (temporary databases)
        run: python -m unittest discover -s tests -p "test_*.py" -v
